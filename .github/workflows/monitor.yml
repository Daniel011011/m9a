name: Check Activity Log

on:
  schedule:
    # 每天北京时间 10:00 (UTC 02:00) 和 23:00 (UTC 15:00)
    - cron: '0 2,15 * * *'
  workflow_dispatch: # 允许手动点击运行测试

jobs:
  check-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Log Activity
        run: |
          LOG_FILE="log.txt"
          
          # 1. 检查文件是否存在
          if [ ! -f "$LOG_FILE" ]; then
            echo "Log file not found!"
            curl -s "https://api.day.app/Ua37yhGwsH7cUVbzhcTpn3/m9a运行失败/找不到日志文件"
            exit 0
          fi

          # 2. 获取最后一行的时间戳并转为 Unix 秒数 (假设 log 格式为 YYYY-MM-DD HH:MM:SS)
          LAST_LOG_TIME=$(tail -n 1 "$LOG_FILE")
          echo "最后记录时间: $LAST_LOG_TIME"
          
          # 将北京时间格式转换为 Unix 时间戳 (Linux 环境下处理)
          # 注意：date 指令在处理这种格式时需要指定时区或确保环境一致
          LAST_TS=$(date -d "$LAST_LOG_TIME" +%s)
          CURRENT_TS=$(date +%s)
          
          # 3. 计算差值（秒）
          DIFF=$(( CURRENT_TS - LAST_TS ))
          THREE_HOURS_IN_SECONDS=10800
          
          echo "当前时间戳: $CURRENT_TS"
          echo "时间差(秒): $DIFF"

          if [ $DIFF -gt $THREE_HOURS_IN_SECONDS ]; then
            echo "超过3小时没有记录，发送警告！"
            curl -s "https://api.day.app/Ua37yhGwsH7cUVbzhcTpn3/m9a运行失败/记录已停滞${DIFF}秒"
          else
            echo "记录正常，无需操作。"
          fi