name: Check Activity Log
permissions:
  contents: write
on:
  schedule:
    # 每天两次检查（UTC时间）
    # 10:10 SGT ≈ 02:10 UTC
    # 00:10 SGT ≈ 16:10 UTC
    - cron: '10 2,16 * * *'
  workflow_dispatch:

jobs:
  check-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check log windows
        run: |
          export TZ='Asia/Shanghai'

          LOG_FILE="log.txt"
          LAST_OK_FILE=".last_success_ts"

          # === 1. 检查日志 ===
          if [ ! -f "$LOG_FILE" ]; then
            echo "❌ log.txt 不存在"
            exit 1
          fi

          LAST_LOG_TIME=$(tail -n 1 "$LOG_FILE")
          LAST_LOG_TS=$(date -d "$LAST_LOG_TIME" +%s)

          echo "日志时间: $LAST_LOG_TIME"

          # === 2. 当前时间 ===
          NOW_TS=$(date +%s)
          TODAY=$(date +"%Y-%m-%d")
          YESTERDAY=$(date -d "yesterday" +"%Y-%m-%d")

          # === 3. 定义窗口 ===
          MORNING_START=$(date -d "$TODAY 08:03:00" +%s)
          MORNING_END=$((MORNING_START + 3600))

          NIGHT_START_TODAY=$(date -d "$TODAY 22:32:00" +%s)
          NIGHT_END_TODAY=$((NIGHT_START_TODAY + 3600))

          NIGHT_START_YESTERDAY=$(date -d "$YESTERDAY 22:32:00" +%s)
          NIGHT_END_YESTERDAY=$((NIGHT_START_YESTERDAY + 3600))

          # === 4. 找最近已结束窗口（核心逻辑） ===
          if [ "$NOW_TS" -ge "$NIGHT_END_TODAY" ]; then
            CHECK_START=$NIGHT_START_TODAY
            CHECK_END=$NIGHT_END_TODAY
            LABEL="今晚窗口"
          elif [ "$NOW_TS" -ge "$MORNING_END" ]; then
            CHECK_START=$MORNING_START
            CHECK_END=$MORNING_END
            LABEL="早上窗口"
          else
            CHECK_START=$NIGHT_START_YESTERDAY
            CHECK_END=$NIGHT_END_YESTERDAY
            LABEL="昨晚窗口"
          fi

          echo "当前检查窗口: $LABEL"

          STATUS="ok"
          MSG=""

          # === 5. 判断是否命中窗口 ===
          if [ "$LAST_LOG_TS" -ge "$CHECK_START" ] && [ "$LAST_LOG_TS" -le "$CHECK_END" ]; then
            echo "✅ $LABEL 正常"
            echo "$LAST_LOG_TS" > "$LAST_OK_FILE"
          else
            STATUS="fail"
            MSG="$LABEL 未更新"
          fi

          # === 6. 上次成功时间 ===
          if [ -f "$LAST_OK_FILE" ]; then
            LAST_OK_TS=$(cat "$LAST_OK_FILE")
            LAST_OK_STR=$(date -d "@$LAST_OK_TS" +"%Y-%m-%d %H:%M:%S")
          else
            LAST_OK_STR="无记录"
          fi

          # === 7. 通知 ===
          if [ "$STATUS" = "fail" ]; then
            echo "❌ $MSG"
            curl -s "https://api.day.app/Ua37yhGwsH7cUVbzhcTpn3/m9a运行失败/${MSG} 上次成功:${LAST_OK_STR}"
          else
            echo "状态正常"
          fi

      - name: Save last success
        run: |
          export TZ='Asia/Shanghai'

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .last_success_ts
          git commit -m "update last success time" || echo "no changes"
          git push
