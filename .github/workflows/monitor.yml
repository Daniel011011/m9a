name: Check Activity Log

permissions:
  contents: write

on:
  schedule:
    - cron: '10 2,16 * * *'
  workflow_dispatch:

jobs:
  check-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check log windows
        run: |
          set +e
          export TZ='Asia/Shanghai'

          LOG_FILE="log.txt"

          # === 1. 检查日志 ===
          if [ ! -f "$LOG_FILE" ]; then
            echo "❌ log.txt 不存在"
            curl -s "https://api.day.app/Ua37yhGwsH7cUVbzhcTpn3/m9a运行失败/log不存在" || true
            exit 0
          fi

          LAST_LOG_TIME=$(tail -n 1 "$LOG_FILE")
          LAST_LOG_TS=$(date -d "$LAST_LOG_TIME" +%s)

          # 👉 关键：读取“上一条日志”
          PREV_LOG_TIME=$(tail -n 2 "$LOG_FILE" | head -n 1)

          echo "日志时间: $LAST_LOG_TIME"
          echo "上一条日志: $PREV_LOG_TIME"

          # === 2. 当前时间 ===
          NOW_TS=$(date +%s)
          TODAY=$(date +"%Y-%m-%d")
          YESTERDAY=$(date -d "yesterday" +"%Y-%m-%d")

          # === 3. 定义窗口 ===
          MORNING_START=$(date -d "$TODAY 08:03:00" +%s)
          MORNING_END=$((MORNING_START + 3600))

          NIGHT_START_TODAY=$(date -d "$TODAY 22:32:00" +%s)
          NIGHT_END_TODAY=$((NIGHT_START_TODAY + 3600))

          NIGHT_START_YESTERDAY=$(date -d "$YESTERDAY 22:32:00" +%s)
          NIGHT_END_YESTERDAY=$((NIGHT_START_YESTERDAY + 3600))

          # === 4. 找最近已结束窗口 ===
          if [ "$NOW_TS" -ge "$NIGHT_END_TODAY" ]; then
            CHECK_START=$NIGHT_START_TODAY
            CHECK_END=$NIGHT_END_TODAY
            LABEL="今晚窗口"
          elif [ "$NOW_TS" -ge "$MORNING_END" ]; then
            CHECK_START=$MORNING_START
            CHECK_END=$MORNING_END
            LABEL="早上窗口"
          else
            CHECK_START=$NIGHT_START_YESTERDAY
            CHECK_END=$NIGHT_END_YESTERDAY
            LABEL="昨晚窗口"
          fi

          echo "当前检查窗口: $LABEL"

          STATUS="ok"
          MSG=""

          # === 5. 判断 ===
          if [ "$LAST_LOG_TS" -ge "$CHECK_START" ] && [ "$LAST_LOG_TS" -le "$CHECK_END" ]; then
            echo "✅ $LABEL 正常"
          else
            STATUS="fail"
            MSG="$LABEL 未更新"
          fi

          # === 6. 上次成功时间（来自 log.txt）===
          if [ -n "$PREV_LOG_TIME" ]; then
            LAST_OK_STR=$(echo "$PREV_LOG_TIME" | tr ' ' '-')
          else
            LAST_OK_STR="无记录"
          fi

          # === 7. 通知 ===
          if [ "$STATUS" = "fail" ]; then
            echo "❌ $MSG"

            MSG_CLEAN=$(echo "$MSG" | tr -d ' ')

            MSG_FULL="${MSG_CLEAN}上次成功${LAST_OK_STR}"

            curl -s "https://api.day.app/Ua37yhGwsH7cUVbzhcTpn3/m9a运行失败/${MSG_FULL}" || true

          else
            echo "状态正常"
          fi
