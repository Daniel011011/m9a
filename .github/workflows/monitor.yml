name: Check Activity Log

on:
  schedule:
    - cron: '10 2,16 * * *'
  workflow_dispatch:

jobs:
  check-log:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check log windows
        run: |
          LOG_FILE="log.txt"
          LAST_OK_FILE=".last_success_ts"

          if [ ! -f "$LOG_FILE" ]; then
            echo "❌ log.txt 不存在"
            exit 1
          fi

          LAST_LOG_TIME=$(tail -n 1 "$LOG_FILE")
          LAST_LOG_TS=$(date -d "$LAST_LOG_TIME +0800" +%s)

          # 当前北京时间
          NOW_LOCAL=$(date -u -d "+8 hour" +"%Y-%m-%d %H:%M:%S")
          TODAY=$(date -u -d "+8 hour" +"%Y-%m-%d")
          YESTERDAY=$(date -u -d "+8 hour -1 day" +"%Y-%m-%d")

          echo "当前时间: $NOW_LOCAL"
          echo "日志时间: $LAST_LOG_TIME"

          # === 定义两个窗口 ===
          MORNING_START=$(date -d "$TODAY 08:03:00 +0800" +%s)
          MORNING_END=$((MORNING_START + 3600))

          NIGHT_START_TODAY=$(date -d "$TODAY 22:32:00 +0800" +%s)
          NIGHT_END_TODAY=$((NIGHT_START_TODAY + 3600))

          NIGHT_START_YESTERDAY=$(date -d "$YESTERDAY 22:32:00 +0800" +%s)
          NIGHT_END_YESTERDAY=$((NIGHT_START_YESTERDAY + 3600))

          STATUS="ok"
          MSG=""

          # === 判断当前是在检查哪个窗口 ===
          HOUR=$(date -u -d "+8 hour" +%H)

          if [ "$HOUR" -lt 12 ]; then
            # 👉 早上运行 → 检查今天早上窗口
            echo "检查：早上窗口"

            if [ "$LAST_LOG_TS" -ge "$MORNING_START" ] && [ "$LAST_LOG_TS" -le "$MORNING_END" ]; then
              echo "✅ 早上窗口正常"
              echo "$LAST_LOG_TS" > "$LAST_OK_FILE"
            else
              STATUS="fail"
              MSG="早上窗口未更新"
            fi

          else
            # 👉 半夜运行 → 检查昨天晚上窗口
            echo "检查：晚上窗口"

            if [ "$LAST_LOG_TS" -ge "$NIGHT_START_YESTERDAY" ] && [ "$LAST_LOG_TS" -le "$NIGHT_END_YESTERDAY" ]; then
              echo "✅ 晚上窗口正常"
              echo "$LAST_LOG_TS" > "$LAST_OK_FILE"
            else
              STATUS="fail"
              MSG="晚上窗口未更新"
            fi
          fi

          # === 上次成功时间 ===
          if [ -f "$LAST_OK_FILE" ]; then
            LAST_OK_TS=$(cat "$LAST_OK_FILE")
            LAST_OK_STR=$(date -d "@$LAST_OK_TS" +"%Y-%m-%d %H:%M:%S")
          else
            LAST_OK_STR="无记录"
          fi

          # === 报警 ===
          if [ "$STATUS" = "fail" ]; then
            echo "❌ $MSG"
            curl -s "https://api.day.app/Ua37yhGwsH7cUVbzhcTpn3/m9a运行失败/${MSG} 上次成功:${LAST_OK_STR}"
          else
            echo "状态正常"
          fi

      - name: Save last success
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .last_success_ts
          git commit -m "update last success time" || echo "no changes"
          git push
