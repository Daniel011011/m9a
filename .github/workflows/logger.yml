name: Time Logger

on:
  repository_dispatch:
    types: [worker_log]

jobs:
  update-log:
    runs-on: ubuntu-latest
    # 必须显式声明权限，确保安全
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append Timestamp and Push
        run: |
          # 1. 设置 Git 用户信息
          git config --global user.name "Github Action Bot"
          git config --global user.email "actions@github.com"

          # 2. 获取当前时间（UTC+8 示例）并追加到文件
          # 使用 TZ=Asia/Shanghai 可以获取中国标准时间
          echo "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> log.txt

          # 3. 提交并推送
          git add log.txt
          git commit -m "chore: add timestamp [skip ci]"
          git push